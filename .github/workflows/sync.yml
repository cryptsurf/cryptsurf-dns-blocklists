name: Build CryptSurf DNS blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build lists
        run: python3 scripts/build_cryptsurf_lists.py

      - name: Commit generated output
        run: |
          git config user.name "cryptsurf-dns-bot"
          git config user.email "dns-bot@cryptsurf.net"
          git add output
          git diff --cached --quiet || git commit -m "Update generated DNS blocklists"
          git push
